<title>Abhinav Sharma — Developer</title>

<style>
  :root {
    --color-pink: #ff007f;
    --color-blue: #00f0ff;
    --color-yellow: #ffde00;
    --bg: #0a0a0a;
    --text: #ffffff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    overflow-x: hidden;
    min-height: 100vh;
  }
  /* Aurora Background */
  .aurora {
    position: fixed;
    top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -1;
    overflow: hidden;
    background: var(--bg);
    filter: blur(80px);
    opacity: 0.6;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    animation: float 15s infinite alternate ease-in-out;
  }
  .blob-1 { width: 40vw; height: 40vw; background: var(--color-pink); top: -10%; left: -10%; }
  .blob-2 { width: 35vw; height: 35vw; background: var(--color-blue); bottom: -10%; right: -10%; animation-delay: -5s; }
  .blob-3 { width: 30vw; height: 30vw; background: var(--color-yellow); top: 40%; left: 40%; animation-delay: -10s; }
  @keyframes float {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(10vw, 15vh) scale(1.2); }
  }

  nav {
    position: absolute; /* Allows it to scroll away */
    top: 0; width: 100%;
    padding: 40px 5%;
    display: flex; justify-content: space-between; align-items: center;
    z-index: 10;
  }
  .brand {
    font-family: 'Syncopate', sans-serif;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 2px;
  }
  .status { font-size: 14px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
  .status-dot {
    width: 10px; height: 10px; border-radius: 50%;
    background: var(--color-yellow);
    box-shadow: 0 0 10px var(--color-yellow);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

  .container { max-width: 1200px; margin: 0 auto; padding: 150px 5% 100px; }
  
  h1 { font-family: 'Syncopate', sans-serif; font-size: clamp(40px, 8vw, 90px); line-height: 1.1; margin-bottom: 30px; text-transform: uppercase; }
  .hero p { font-size: 20px; max-width: 600px; line-height: 1.6; margin-bottom: 80px; }

  .section-title { font-family: 'Syncopate', sans-serif; font-size: 30px; margin-bottom: 40px; border-bottom: 2px solid rgba(255,255,255,0.2); padding-bottom: 10px; }

  /* Magnetic Items */
  .magnetic-wrap { display: inline-block; padding: 20px; margin: -20px; perspective: 1000px; }
  .magnetic { transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); will-change: transform; cursor: pointer; }

  /* Projects */
  .projects { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 40px; margin-bottom: 100px; }
  .project-card {
    padding: 40px; border-radius: 20px;
    background: rgba(0, 240, 255, 0.1);
    border: 1px solid rgba(0, 240, 255, 0.3);
    backdrop-filter: blur(10px);
    text-decoration: none; color: #fff;
    display: block;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .project-card.pink {
    background: rgba(255, 0, 127, 0.1);
    border-color: rgba(255, 0, 127, 0.3);
  }
  .project-title { font-family: 'Syncopate', sans-serif; font-size: 24px; margin-bottom: 15px; }
  .project-desc { font-size: 16px; margin-bottom: 25px; line-height: 1.5; opacity: 0.9; }
  .tags { display: flex; flex-wrap: wrap; gap: 10px; }
  .tag { padding: 5px 12px; font-size: 12px; font-weight: 600; border-radius: 50px; background: rgba(255,255,255,0.1); }

  /* Skills */
  .skills-container { display: flex; flex-wrap: wrap; gap: 15px; margin-bottom: 100px; }
  .skill-pill {
    padding: 15px 30px; font-size: 18px; font-weight: 500; border-radius: 50px;
    background: rgba(255, 222, 0, 0.1); border: 1px solid rgba(255, 222, 0, 0.4);
    backdrop-filter: blur(5px);
  }
